<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SINGULARITY</title>
<meta name="description" content="An endless gravity-well game. Consume. Grow. Survive.">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=b10">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="layer hidden">
  <div class="hud-top">
    <div class="hud-block">
      <div class="hud-label">MASS</div>
      <div class="hud-value" id="hudScore">0</div>
    </div>
    <div class="hud-block right">
      <div class="hud-label">BEST</div>
      <div class="hud-value" id="hudBest">0</div>
    </div>
  </div>
  <div id="comboWrap">
    <div id="comboValue"></div>
    <div id="comboBar"><i></i></div>
  </div>
  <button id="pauseBtn" class="icon-btn pause-btn" aria-label="Pause">&#10074;&#10074;</button>
  <button id="muteBtn" class="icon-btn" aria-label="Toggle sound">&#9834;</button>
</div>

<div id="menu" class="layer center">
  <div class="title">SINGULARITY</div>
  <div class="subtitle">Consume. Grow. Survive.</div>
  <button id="playBtn" class="btn">TAP TO BEGIN</button>
  <div class="hint">Drag anywhere, move the mouse, or use WASD &nbsp;&bull;&nbsp; swallow what's smaller &nbsp;&bull;&nbsp; flee what isn't</div>
  <div class="hint dim" id="menuBest"></div>
  <div class="hint dim" id="buildTag"></div>
</div>

<div id="over" class="layer center hidden">
  <div class="over-title">COLLAPSE</div>
  <div class="score-big" id="finalScore">0</div>
  <div class="newbest hidden" id="newBest">NEW PERSONAL BEST</div>
  <div class="hint" id="overBest"></div>
  <button id="againBtn" class="btn">RUN AGAIN</button>
  <button id="overHomeBtn" class="btn ghost">HOME</button>
  <div class="hint dim">or tap anywhere</div>
</div>

<div id="pause" class="layer center overlay hidden">
  <div class="panel">
    <div class="panel-title">PAUSED</div>
    <div class="hint dim" id="pauseScore"></div>
    <button id="resumeBtn" class="btn">PLAY</button>
    <button id="restartBtn" class="btn ghost">RESTART</button>
    <button id="settingsBtn" class="btn ghost">SETTINGS</button>
    <button id="homeBtn" class="btn ghost">HOME</button>
  </div>
</div>

<div id="settings" class="layer center overlay hidden">
  <div class="panel">
    <div class="panel-title">SETTINGS</div>
    <button id="soundBtn" class="btn ghost">SOUND: ON</button>
    <button id="motionBtn" class="btn ghost">MOTION: ON</button>
    <button id="cbBtn" class="btn ghost">COLOUR: NORMAL</button>
    <button id="ctrlBtn" class="btn ghost">CONTROL: JOYSTICK</button>
    <button id="settingsBackBtn" class="btn">BACK</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="fatal" class="fatal hidden"></div>

<script src="game.js?v=b10"></script>
</body>
</html>
