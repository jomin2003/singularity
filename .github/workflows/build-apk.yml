name: Build Debug APK

# Produces an APK you can install straight onto a phone.
#
# Uses the standard Android debug signing key, so it needs NO keystore and NO
# repository secrets -- unlike build-aab.yml. This is the fastest way to get
# the game into your hands. It is not what you upload to Play.
#
# To install: download the artifact, copy app-debug.apk to your phone
# (USB / Drive / WhatsApp to yourself), open it, and allow "install unknown
# apps" for your file manager when Android asks.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # android/capacitor.settings.gradle points :capacitor-android at
      # ../node_modules/@capacitor/android/capacitor, so node deps must be
      # installed before Gradle runs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor dependencies
        run: npm ci

      # MUST stay before the Gradle step -- see build-aab.yml for why
      # (it recreates gitignored-but-required directories).
      - name: Sync web assets into the Android project
        run: npx cap sync android

      # app/capacitor.build.gradle pins sourceCompatibility to VERSION_21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singularity-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
