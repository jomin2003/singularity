name: Build Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Assemble signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # android/capacitor.settings.gradle points the :capacitor-android module at
      # ../node_modules/@capacitor/android/capacitor, so the node deps MUST be
      # installed before Gradle runs or configuration fails immediately.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor dependencies
        run: npm ci

      # MUST stay before the Gradle step. Three things it produces are
      # gitignored but required for the build to configure at all:
      #   1. app/src/main/assets/public            -- the actual game
      #   2. capacitor-cordova-android-plugins/    -- Capacitor's own
      #      android/.gitignore excludes it, yet settings.gradle includes
      #      ':capacitor-cordova-android-plugins' unconditionally. Verified:
      #      `cap sync` does recreate it, but only because it runs first.
      #   3. capacitor.config.json / capacitor.plugins.json
      - name: Sync web assets into the Android project
        run: npx cap sync android

      # app/capacitor.build.gradle pins sourceCompatibility to VERSION_21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify signing secrets
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "Add these repo secrets under Settings -> Secrets and variables -> Actions:"
            echo "  KEYSTORE_BASE64      base64 of your .jks/.keystore file"
            echo "  KEYSTORE_PASSWORD    keystore password"
            echo "  KEY_ALIAS            key alias"
            echo "  KEY_PASSWORD         key password"
            exit 1
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release bundle
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease
        working-directory: android
        env:
          # Absolute: build.gradle's file() resolves relative paths against
          # android/app/, not the repo root, so a relative value would miss.
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Inspect bundle
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          echo "--- native libraries (16 KB page-size rule) ---"
          if unzip -l "$AAB" | grep -Eq '\.so$'; then
            echo "::warning::Native .so files found - confirm 16 KB ELF alignment before submitting."
            unzip -l "$AAB" | grep -E '\.so$'
          else
            echo "No native libraries: the 16 KB page-size requirement does not apply."
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
